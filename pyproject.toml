[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qiboml-flower-tutorial"
version = "1.0.0"
description = "Quantum Federated Learning with Qiboml and Flower"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "flwr[simulation]==1.27.0",
    "flwr-datasets[vision]==0.6.0",
    "qibo==0.2.22",
    "qiboml[torch]==0.1.0",
    "scikit-learn",
    "matplotlib",
    "numpy",
    "torch",
    "scipy",
    "datasets",
]

[tool.hatch.build.targets.wheel]
packages = ["qibo_qfl_pt", "thesis_plots"]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "qibo_qfl_pt.server_app:app"
clientapp = "qibo_qfl_pt.client_app:app"

[tool.flwr.app.config]

# model and data
circuit = "2q"
dataset = "circle"
model-type = "quantum"
hidden-classical = 9
n-train-data = 500
n-eval-data = 200

# federation
strategy = "FedAvg"
num-server-rounds = 10
num-clients = 5
num-partitions = 5
min-available-clients = 2
fraction-fit = 0.75
fraction-evaluate = 0.75
iid = true
alpha = 1.8

# local training
local-epochs = 2
batch-size = 8
eta_l = 0.35
eta = 0.1
mu = 0.05

# noise (mode = noiseless, noisy, mitigated)
mode = "noiseless"
nshots = "none"
base-pauli = 0.005
base-readout = 0.005
scale = 0.002
walk-sigma = 0.0001
walk-seed = 7
drift-type = "rw"
walk-theta = 0.1

# error mitigation (cdr)
cdr-threshold = 0.015
cdr-mode = "no_memory"
cdr-beta = 0.5
cdr-intra-beta = 0

# seeds
seed = 2
data-seed = 2
init-seed = 2
sampling-seed = 2
seed-label = ""

# output
save-path = "default_path"
save-weights = true
save-scatter = false
testing = true
run-id = 0



#######################################################################
# CONFIGURATION MIGRATION NOTICE:
